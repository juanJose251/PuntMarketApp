name: Supabase keep-alive

# Supabase (plan gratis) pausa el proyecto tras ~1 semana sin actividad.
# Esta consulta ligera lo mantiene activo. Solo aplica a la version del cliente.
# Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY; sin ellos el job se omite.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping products table
        if: env.SUPABASE_URL != ''
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
